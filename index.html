<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전공 계열 적합성 검사 (간이검사)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom radio button styles for a better look and feel */
        .custom-radio-label {
            transition: all 0.2s ease-in-out;
        }
        /* Colored checked states for each score */
        .custom-radio:checked + .score-1 {
            background-color: #ef4444; /* red-500 */ color: white; border-color: #ef4444; transform: scale(1.05);
        }
        .custom-radio:checked + .score-2 {
            background-color: #f97316; /* orange-500 */ color: white; border-color: #f97316; transform: scale(1.05);
        }
        .custom-radio:checked + .score-3 {
            background-color: #64748b; /* slate-500 */ color: white; border-color: #64748b; transform: scale(1.05);
        }
        .custom-radio:checked + .score-4 {
            background-color: #0ea5e9; /* sky-500 */ color: white; border-color: #0ea5e9; transform: scale(1.05);
        }
        .custom-radio:checked + .score-5 {
            background-color: #2563eb; /* blue-600 */ color: white; border-color: #2563eb; transform: scale(1.05);
        }

        /* Fade-in animation for results */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        
        /* Loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Styles for AI generated content */
        #geminiContent h3 {
            font-size: 1.25rem; /* text-xl */
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #1e293b; /* slate-800 */
        }
        #geminiContent ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        #geminiContent li {
            margin-bottom: 0.5rem;
        }
        #geminiContent strong {
            color: #0369a1; /* sky-700 */
        }

    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="container mx-auto max-w-4xl p-4 sm:p-8">
        <!-- Header Section -->
        <header class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-900">🌟 전공 계열 적합성 검사</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-blue-600 mt-2">(간이검사)</h2>
            <p class="mt-4 text-slate-600 max-w-2xl mx-auto">
                각 문항을 천천히 읽고, 자신의 모습과 가장 가깝다고 생각하는 곳에 솔직하게 체크해 주세요. 이 검사는 여러분의 진로 설계를 돕기 위한 참고 자료입니다.
            </p>
        </header>

        <!-- Main Form for Questions -->
        <form id="aptitudeTestForm">
            <div id="questionsContainer" class="space-y-8">
                <!-- Questions will be dynamically inserted here -->
            </div>

            <!-- Action Buttons -->
            <div class="mt-12 text-center">
                <button type="submit" class="bg-blue-600 text-white font-bold py-3 px-10 rounded-lg shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    결과 보기
                </button>
            </div>
        </form>

        <!-- Results Section (Initially Hidden) -->
        <div id="resultsContainer" class="hidden mt-12">
            <div id="resultCard" class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200">
                <h2 class="text-3xl font-bold text-center text-slate-900 mb-6">📊 검사 결과</h2>
                <div id="resultsContent" class="space-y-4">
                    <!-- Result bars will be dynamically inserted here -->
                </div>
                <div id="resultAnalysis" class="mt-8 p-6 rounded-lg">
                    <!-- Detailed analysis will be shown here -->
                </div>

                <!-- Gemini AI Feature Section -->
                <div class="text-center mt-10 border-t pt-8">
                     <button type="button" id="getAiRecommendationButton" class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold w-full sm:w-auto py-4 px-10 rounded-lg shadow-lg hover:from-purple-600 hover:to-indigo-700 transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300 text-lg">
                        ✨ AI 진로 추천받기
                    </button>
                </div>
                <div id="geminiResultContainer" class="hidden mt-8">
                    <div id="geminiLoader" class="text-center">
                         <div class="loader"></div>
                         <p class="text-slate-600 font-semibold">AI가 맞춤형 진로를 분석하고 있습니다...</p>
                    </div>
                    <div id="geminiContent" class="p-6 bg-slate-50 rounded-lg border border-slate-200 prose max-w-none">
                        <!-- AI recommendation will be shown here -->
                    </div>
                </div>

                <div id="resultActions" class="mt-10 text-center flex flex-col sm:flex-row justify-center items-center gap-4 border-t pt-8">
                    <button type="button" id="saveJpgButton" class="bg-blue-600 text-white font-bold w-full sm:w-auto py-3 px-10 rounded-lg shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
                        JPG로 저장
                    </button>
                    <button type="button" id="savePdfButton" class="bg-emerald-600 text-white font-bold w-full sm:w-auto py-3 px-10 rounded-lg shadow-lg hover:bg-emerald-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-emerald-300">
                        PDF로 저장
                    </button>
                    <button type="button" id="retryButton" class="bg-slate-600 text-white font-bold w-full sm:w-auto py-3 px-10 rounded-lg shadow-lg hover:bg-slate-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-slate-300">
                        다시하기
                    </button>
                </div>
            </div>
        </div>
    </div>

            function renderQuestions() {
                const scoreColors = [ 'bg-red-100 border-red-300 text-red-800 hover:bg-red-200', 'bg-orange-100 border-orange-300 text-orange-800 hover:bg-orange-200', 'bg-slate-100 border-slate-300 text-slate-800 hover:bg-slate-200', 'bg-sky-100 border-sky-300 text-sky-800 hover:bg-sky-200', 'bg-blue-100 border-blue-300 text-blue-800 hover:bg-blue-200' ];
                let html = '';
                categories.forEach((category, catIndex) => {
                    html += `<div class="bg-white p-6 rounded-xl shadow-md border border-slate-100"><h3 class="text-xl font-bold mb-6 border-l-4 ${category.borderColor} pl-3 ${category.textColor}">${catIndex + 1}. ${category.name}</h3><div class="space-y-6">`;
                    category.questions.forEach((question, qIndex) => {
                        const questionId = `q_${catIndex}_${qIndex}`;
                        html += `<div class="question-item"><p class="mb-3 font-medium text-slate-700">${qIndex + 1}. ${question}</p><div class="flex flex-wrap justify-center gap-2 text-center">`;
                        for (let i = 1; i <= 5; i++) {
                            html += `<div class="flex-1 min-w-[50px]"><input type="radio" id="${questionId}_${i}" name="${questionId}" value="${i}" class="sr-only custom-radio" required><label for="${questionId}_${i}" class="custom-radio-label score-${i} block w-full cursor-pointer rounded-lg border p-2 text-sm font-semibold ${scoreColors[i-1]}">${scoreLabels[i]}</label></div>`;
                        }
                        html += `</div></div>`;
                    });
                    html += `</div></div>`;
                });
                questionsContainer.innerHTML = html;
            }

            function calculateScores(formData) {
                const scores = {};
                categories.forEach(cat => scores[cat.key] = 0);
                for (let [key, value] of formData.entries()) {
                    const [, catIndex, ] = key.split('_');
                    scores[categories[catIndex].key] += parseInt(value, 10);
                }
                return scores;
            }

            function displayResults(scores) {
                const sortedScores = Object.entries(scores).map(([key, score]) => ({ key, score, ...categories.find(c => c.key === key) })).sort((a, b) => b.score - a.score);
                currentResults = sortedScores;
                let html = '';
                const maxScore = 50;
                sortedScores.forEach(item => {
                    const percentage = (item.score / maxScore) * 100;
                    html += `<div class="result-item"><div class="flex justify-between items-center mb-1"><span class="font-bold text-slate-700">${item.name}</span><span class="font-bold text-slate-600">${item.score}점</span></div><div class="w-full bg-slate-200 rounded-full h-4"><div class="${item.color} h-4 rounded-full" style="width: ${percentage}%"></div></div></div>`;
                });
                resultsContent.innerHTML = html;
                const topCategory = sortedScores[0];
                resultAnalysis.className = `mt-8 p-6 border-2 border-dashed rounded-lg ${topCategory.bgColor} ${topCategory.borderColor}`;
                resultAnalysis.innerHTML = `<h3 class="text-xl font-bold ${topCategory.textColor} mb-2">⭐ 가장 높은 점수를 받은 계열은 <span class="underline">${topCategory.name}</span> 입니다!</h3><p class="text-slate-700">${topCategory.description}</p>`;
                aptitudeTestForm.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
                resultsContainer.classList.add('fade-in');
                window.scrollTo({ top: resultsContainer.offsetTop - 30, behavior: 'smooth' });
            }

            function createFilename(extension) {
                const now = new Date();
                const datePart = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
                return `전공계열적합성검사_결과_${datePart}.${extension}`;
            }
            
            async function saveResultsAsJpg() {
                // ... (previous implementation is correct)
            }
            
            async function saveResultsAsPdf() {
                 // ... (previous implementation is correct)
            }

            function markdownToHtml(text) {
                return text
                    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                    .replace(/\*\*(.*)\*\*/g, '<strong>$1</strong>')
                    .replace(/\* (.*$)/gim, '<li>$1</li>')
                    .replace(/<\/li><li>/g, '</li></ul><ul><li>') // Handle multiple lists
                    .replace(/<li>/g, '<ul><li>')
                    .replace(/<\/li>(?!<\/ul>)/g, '</li></ul>')
                    .replace(/<\/li>(\s*<h3>)/g, '</li></ul>$1')
                    .trim();
            }
            
            async function getAiRecommendation() {
                if (!currentResults || currentResults.length === 0) return;

                getAiRecommendationButton.disabled = true;
                geminiResultContainer.classList.remove('hidden');
                geminiLoader.classList.remove('hidden');
                geminiContent.classList.add('hidden');

                let scoreText = currentResults.map(item => `- ${item.name}: ${item.score}점`).join('\n');
                
                const prompt = `
너는 대한민국 고등학생들을 위한 친절하고 유능한 진로 상담사야.
한 학생이 7개 계열에 대한 진로 적성 검사를 마쳤고, 결과는 다음과 같아.

${scoreText}

이 점수 분포를 바탕으로, 학생의 잠재력을 최대한 발휘할 수 있도록 아래 형식에 맞춰 구체적이고 현실적인 조언을 마크다운 형식으로 작성해 줘:

### 🎯 추천 전공 계열
가장 높은 점수를 받은 계열 1~2개를 중심으로, 연관성이 있는 융합 전공 분야를 2~3개 추천해 줘. 각 전공이 무엇을 배우는 곳인지 간략하게 설명해 줘.

### 🚀 미래 직업 경로
추천한 전공과 관련하여, 유망한 미래 직업들을 3~4개 제시해 줘. 각 직업이 어떤 일을 하는지 간단히 설명해 줘.

### 📚 추천 선택 과목 (고교학점제)
추천 전공을 준비하기 위해 고등학교에서 선택하면 좋을 일반선택 및 진로선택 과목들을 추천해 줘.

### 🌱 비교과 활동 제안
학생의 흥미와 강점을 더 발전시킬 수 있는 동아리, 탐구 보고서 주제, 독서, 봉사활동 등 구체적인 비교과 활동 아이디어를 제안해 줘.
                `;

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const payload = { contents: [{ parts: [{ text: prompt }] }] };

                try {
                    // Basic exponential backoff implementation
                    let response;
                    let retries = 3;
                    let delay = 1000;
                    for (let i = 0; i < retries; i++) {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                        if (response.status === 429 || response.status >= 500) {
                             await new Promise(resolve => setTimeout(resolve, delay));
                             delay *= 2;
                        } else {
                            break;
                        }
                    }

                    if (!response.ok) {
                        throw new Error(`API call failed with status ${response.status}`);
                    }
                    
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const generatedText = candidate.content.parts[0].text;
                        geminiContent.innerHTML = markdownToHtml(generatedText);
                    } else {
                         throw new Error("Invalid response structure from API.");
                    }
                } catch (error) {
                    console.error('Error fetching AI recommendation:', error);
                    geminiContent.innerHTML = `<p class="text-red-600 font-semibold">AI 추천을 가져오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>`;
                } finally {
                    geminiLoader.classList.add('hidden');
                    geminiContent.classList.remove('hidden');
                    getAiRecommendationButton.disabled = false;
                }
            }
            
            // --- EVENT LISTENERS ---
            aptitudeTestForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(aptitudeTestForm);
                const totalQuestions = categories.reduce((acc, cat) => acc + cat.questions.length, 0);
                if (Array.from(formData.keys()).length < totalQuestions) {
                    let messageBox = document.getElementById('alert-message');
                    if (!messageBox) {
                        messageBox = document.createElement('div');
                        messageBox.id = 'alert-message';
                        messageBox.className = 'fixed top-5 left-1/2 -translate-x-1/2 bg-red-500 text-white py-3 px-6 rounded-lg shadow-lg z-50';
                        document.body.appendChild(messageBox);
                    }
                    messageBox.textContent = '모든 문항에 답변해주세요!';
                    messageBox.style.display = 'block';
                    setTimeout(() => { messageBox.style.display = 'none'; }, 3000);
                    for(let i = 0; i < categories.length; i++) {
                        for(let j = 0; j < categories[i].questions.length; j++) {
                            if (!formData.has(`q_${i}_${j}`)) {
                                document.getElementsByName(`q_${i}_${j}`)[0].closest('.question-item').scrollIntoView({ behavior: 'smooth', block: 'center'});
                                return;
                            }
                        }
                    }
                    return;
                }
                const scores = calculateScores(formData);
                displayResults(scores);
            });

            retryButton.addEventListener('click', () => {
                resultsContainer.classList.add('hidden');
                resultsContainer.classList.remove('fade-in');
                aptitudeTestForm.classList.remove('hidden');
                geminiResultContainer.classList.add('hidden'); // Hide gemini result on retry
                aptitudeTestForm.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            getAiRecommendationButton.addEventListener('click', getAiRecommendation);
            saveJpgButton.addEventListener('click', saveResultsAsJpg);
            savePdfButton.addEventListener('click', saveResultsAsPdf);

            renderQuestions();
        });
    </script>
